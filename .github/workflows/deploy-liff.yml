name: Deploy LIFF UI

on:
  push:
    branches:
      - main
      - backend
      - V3.1
      - claude/wizardly-goodall-pm2et8
    paths:
      - 'liff/**'
      - '.github/workflows/deploy-liff.yml'
  workflow_dispatch:

# อนุญาตให้ job เขียน GitHub Pages ได้ (id-token ใช้ตอน deploy)
permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละคิว ไม่ยกเลิกตัวที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ต้องเปิด Pages ด้วยมือครั้งเดียวก่อน ที่ Settings > Pages > Source = GitHub Actions
      # (GITHUB_TOKEN ของ Actions ไม่มีสิทธิ์สร้าง Pages site ให้เอง และ repo private
      #  ต้องใช้ GitHub Pro ขึ้นไป ถ้าไม่มีให้เปลี่ยน repo เป็น public ก่อน)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload liff/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: liff

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
