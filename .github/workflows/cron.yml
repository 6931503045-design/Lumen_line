name: Cron

# ตารางตาม SPEC.md ตาราง "งานตามเวลา" (เวลาไทย):
#   emailPoll    ทุก 5 นาที
#   recurring    06:00
#   cleanup      03:00
#   planCheck    09:00   (ส่ง push ได้เฉพาะ 08:00–20:59 — JOB_WINDOWS ใน src/config/constants.ts)
#   dailySummary 21:00   (ส่ง push ได้เฉพาะ 20:00–23:59)
#
# ต้องตั้ง 2 secrets ในหน้า Settings > Secrets and variables > Actions ของ repo:
#   BACKEND_URL  - URL ของ backend ที่ deploy แล้ว เช่น https://lumen-line.onrender.com
#   CRON_SECRET  - ค่าเดียวกับ env CRON_SECRET ของ backend
# ถ้ายังไม่ตั้ง workflow จะข้ามไปเงียบๆ ไม่ใช่ล้มเหลว เพราะยังไม่มีอะไรให้เรียก
#
# ⚠️ workflow ที่มี schedule จะถูกลงทะเบียนจาก "default branch" เท่านั้น
# แก้ไฟล์นี้บน branch อื่นแล้วไม่เห็นผล = ปกติ ต้อง merge เข้า default branch ก่อน
#
# 🔴 GitHub Actions ไม่ตรงเวลาเลย — ข้อมูลจริง 31 ต.ค.–8 พ.ย. 2026:
#   */5 นาที ยิงจริงห่างกันเฉลี่ย ~2.5 ชม. · รอบ 21:00 ไปยิงจริง 01:30–04:00 ของวันถัดไป
# จึงเลิกผูกงานกับรอบ schedule แต่ละรอบแล้ว: "ทุกรอบที่ยิงมา เรียกทุกงาน"
# ให้ backend ตัดสินเองว่าตอนนี้ควรทำอะไร (งานที่ส่ง push จะข้ามไปถ้าอยู่นอกช่วงเวลา)
# ปลอดภัยเพราะทุกงาน idempotent:
#   emailPoll กันซ้ำด้วย Message-ID + S10 dedup
#   recurring กันซ้ำด้วย unique (recurring_rule_id, recurring_run_date)
#   planCheck กับ dailySummary กันซ้ำด้วย dedup_key ของ push_log
#   cleanup ลบเฉพาะของที่หมดอายุแล้ว
#
# ถ้าต้องการให้ตรงเวลาจริง ใช้ cron ภายนอกยิง /jobs/run แทน — ดู docs/DEPLOY.md หัวข้อ "ตั้ง cron ภายนอก"

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 23 * * *'
    - cron: '0 20 * * *'
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: เรียกงานทั้งหมด
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "ยังไม่ได้ตั้ง BACKEND_URL หรือ CRON_SECRET — ข้ามรอบนี้"
            exit 0
          fi

          failed=""
          # ทำต่อให้ครบทุกงานแม้งานก่อนหน้าจะพัง แล้วค่อยทำให้ workflow แดงตอนจบ
          for job in emailPoll recurring planCheck dailySummary cleanup; do
            status=$(curl -sS -o /tmp/jobs-response.json -w '%{http_code}' \
              -X POST "$BACKEND_URL/jobs/run?job=$job" \
              -H "x-cron-secret: $CRON_SECRET" \
              --max-time 120) || status="curl-error"

            echo "[$job] HTTP $status"
            cat /tmp/jobs-response.json 2>/dev/null
            echo

            # 200 เท่านั้นที่ถือว่าสำเร็จ — รอบที่ข้ามเพราะนอกช่วงเวลาก็ตอบ 200 (skipped: outside_window)
            if [ "$status" != "200" ]; then
              echo "::error::เรียก $job ไม่สำเร็จ (HTTP $status)"
              failed="$failed $job"
            fi
          done

          if [ -n "$failed" ]; then
            echo "งานที่ล้มเหลว:$failed"
            exit 1
          fi
