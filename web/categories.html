<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOD tang | หมวดหมู่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=20260922b" />
  </head>
  <body data-page="categories">
    <div class="app-shell">
      <header class="topbar">
        <div class="profile-meta">
          <div class="avatar">PS</div>
          <div>
            <p class="eyebrow">หมวดหมู่</p>
            <h1>แผนงบประมาณ</h1>
          </div>
        </div>
      </header>

      <main class="page-content">
        <section class="hero-dark">
          <div class="hero-top">
            <p class="mini-label" id="categoryOverviewLabel">งบประมาณรวมทั้งหมด</p>
            <span id="categoryOverviewBadge"></span>
          </div>
          <div class="hero-figure">
            <h2 id="categoryOverviewTotal">฿0.00</h2>
          </div>
          <div class="stacked-bar on-dark has-tip" id="categoryOverviewBar"></div>
          <div class="overview-tip" id="categoryOverviewTip" hidden></div>
          <div class="overview-stats">
            <div class="overview-stat">
              <span id="categoryOverviewUsedLabel">ใช้ไปแล้ว</span>
              <strong id="categoryOverviewUsed">฿0.00</strong>
            </div>
            <div class="overview-stat">
              <span id="categoryOverviewRemainingLabel">คงเหลือ</span>
              <strong id="categoryOverviewRemaining">฿0.00</strong>
            </div>
          </div>
        </section>

        <section class="section-panel">
          <div class="panel-head">
            <h3>การใช้หมวดหมู่</h3>
            <div class="panel-actions">
              <button id="toggleCategorySortBtn" class="chip-button" type="button">จัดเรียง</button>
              <button id="addCategoryBtn" class="chip-button" type="button">+ เพิ่มหมวดใหม่</button>
            </div>
          </div>

          <div id="categoryFilters">
            <div class="tab-group" role="tablist" aria-label="กรองหมวดหมู่">
              <button class="tab active" data-category-filter="all">ทั้งหมด</button>
              <button class="tab" data-category-filter="expense">รายจ่าย</button>
              <button class="tab" data-category-filter="income">รายรับ</button>
            </div>

            <input id="categorySearch" class="search-input" type="search" placeholder="ค้นหาหมวดหมู่..." />
          </div>

          <div id="categoryList" class="category-list-wrap"></div>
        </section>
      </main>

      <div id="categorySortBar" class="batch-action-bar hidden"></div>

        <a class="nav-item active" href="categories.html" aria-label="หมวดหมู่">
