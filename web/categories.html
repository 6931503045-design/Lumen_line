<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOD tang | หมวดหมู่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-theme="dark" data-page="categories">
    <div class="app-shell">
      <header class="topbar glass-panel">
        <div class="profile-meta">
          <div class="avatar">AS</div>
          <div>
            <p class="eyebrow">หมวดหมู่</p>
            <h1>แผนงบประมาณ</h1>
          </div>
        </div>
        <button class="theme-toggle" aria-label="สลับโหมด">☀️</button>
      </header>

      <main class="page-content">
        <section class="glass-panel section-panel">
          <div class="panel-head">
            <h3>การใช้หมวดหมู่</h3>
            <div class="panel-actions">
              <button id="toggleCategorySortBtn" class="chip-button" type="button">จัดเรียง</button>
              <button class="chip-button" type="button">+ เพิ่มหมวดใหม่</button>
            </div>
          </div>

          <div class="tab-group" role="tablist" aria-label="กรองหมวดหมู่">
            <button class="tab active" data-category-filter="all">ทั้งหมด</button>
            <button class="tab" data-category-filter="expense">รายจ่าย</button>
            <button class="tab" data-category-filter="income">รายรับ</button>
          </div>

          <div id="categoryList" class="category-list-wrap"></div>
        </section>
      </main>

      <nav class="bottom-nav glass-panel" aria-label="เมนูหลัก">
        <a class="nav-item" href="index.html">ภาพรวม</a>
        <a class="nav-item" href="transactions.html">รายการ</a>
        <a class="nav-item active" href="categories.html">หมวดหมู่</a>
        <a class="nav-item" href="analyze.html">วิเคราะห์</a>
        <a class="nav-item" href="settings.html">ตั้งค่า</a>
      </nav>
    </div>

    <script src="js/api.js"></script>
    <!-- mock-data.js เป็นค่าตั้งต้น/ตัวอย่างตอนยังไม่ล็อกอิน — boot.js จะทับด้วยข้อมูลจริง -->
    <script src="js/mock-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/boot.js"></script>
  </body>
</html>
