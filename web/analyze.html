<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOD tang | วิเคราะห์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=20260919k" />
  </head>
  <body data-page="analyze">
    <div class="app-shell">
      <header class="topbar">
        <div class="profile-meta">
          <div class="avatar">PS</div>
          <div>
            <p class="eyebrow">วิเคราะห์</p>
            <h1>ข้อมูลเชิงลึก</h1>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="segmented-control lime an-tabs" role="tablist" aria-label="มุมมองการวิเคราะห์">
          <button class="segmented active" type="button" data-analyze-tab="overview">ภาพรวม</button>
          <button class="segmented" type="button" data-analyze-tab="category">รายหมวด</button>
        </div>

        <div class="analyze-grid" id="analyzePanelOverview">
          <section class="hero-dark an-status" id="analyzeStatus"></section>

          <section class="an-card dark an-trend" id="analyzeTrend"></section>

          <section class="an-tiles-wrap">
            <div class="an-head">
              <h3>ใช้อย่างปลอดภัยได้</h3>
              <span id="safeToSpendBadgeWrap"></span>
            </div>
            <div class="an-tiles" id="analyzeTiles"></div>
          </section>

          <section class="an-card an-donut">
            <div class="an-head">
              <h3>สัดส่วนรายจ่ายตามหมวด</h3>
            </div>
            <div class="overview-tip" id="analyzeDonutTip" hidden></div>
            <div class="an-donut-body">
              <div class="an-donut-chart" id="analyzeDonutChart"></div>
              <div class="an-donut-legend" id="analyzeDonutLegend"></div>
            </div>
            <p id="emptyStateAnalyze" class="empty-state" hidden>ข้อมูลยังไม่เพียงพอสำหรับการวิเคราะห์ 7 วัน</p>
          </section>

          <section class="an-card lime an-plans" id="plans">
            <div class="an-head">
              <h3>แผนเก็บเงิน</h3>
            </div>
            <div id="planCapacity"></div>
            <div id="planCards" class="goal-stack"></div>
            <button id="createPlanBtn" class="an-add-plan" type="button">
              <span class="an-add-plan-icon" aria-hidden="true"></span>
              <span>สร้างแผนใหม่</span>
            </button>
          </section>

          <section class="an-card dark an-sim">
            <div class="an-head">
              <h3>จำลองผลกระทบก่อนซื้อ</h3>
              <button id="simExplainBtn" class="an-info-btn" type="button" aria-label="อธิบายวิธีคิด"></button>
            </div>
            <label class="an-sim-label" for="purchasePrice">ราคาที่อยากซื้อ (บาท)</label>
            <div class="an-sim-row">
              <input id="purchasePrice" type="number" value="50000" min="0" inputmode="decimal" />
              <button id="simulatePurchaseBtn" class="an-sim-btn" type="button">จำลอง</button>
            </div>
            <p class="an-sim-verdict" id="simVerdict"></p>
            <div class="an-sim-results">
              <div class="an-sim-card">
                <span>ซื้อเลยตอนนี้</span>
                <strong id="buyNowResult">฿0</strong>
                <small id="buyNowNote"></small>
              </div>
              <div class="an-sim-card accent">
                <span>ออมก่อนแล้วค่อยซื้อ</span>
                <strong id="saveLaterResult">—</strong>
                <small id="saveLaterNote"></small>
              </div>
            </div>
            <button type="button" class="an-sim-explain-link" id="simExplainLink">อธิบายวิธีคิด</button>
          </section>
        </div>

        <div class="analyze-category" id="analyzePanelCategory" hidden>
          <div id="analyzeCategory"></div>
        </div>
      </main>

      <nav class="bottom-nav" aria-label="เมนูหลัก">
        <a class="nav-item" href="index.html" aria-label="ภาพรวม">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="nav-label">ภาพรวม</span>
        </a>
        <a class="nav-item" href="transactions.html" aria-label="รายการ">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V7"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/></svg>
          <span class="nav-label">รายการ</span>
        </a>
        <a class="nav-item" href="categories.html" aria-label="หมวดหมู่">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span class="nav-label">หมวดหมู่</span>
        </a>
        <a class="nav-item active" href="analyze.html" aria-label="วิเคราะห์">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          <span class="nav-label">วิเคราะห์</span>
        </a>
        <a class="nav-item" href="settings.html" aria-label="ตั้งค่า">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="nav-label">ตั้งค่า</span>
        </a>
      </nav>
    </div>

    <script src="js/mock-data.js?v=20260919k"></script>
    <script src="js/app.js?v=20260919k"></script>
    <script src="js/api.js"></script>
    <!-- boot.js ต้องมาหลัง app.js เสมอ: มันเรียก initializePage() ที่ app.js ประกาศไว้ -->
    <script src="js/boot.js"></script>
  </body>
</html>
