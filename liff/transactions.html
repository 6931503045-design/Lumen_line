<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOD tang | รายการ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-theme="dark" data-page="transactions">
    <div class="app-shell">
      <header class="topbar glass-panel">
        <div class="profile-meta">
          <div class="avatar">AS</div>
          <div>
            <p class="eyebrow">รายการ</p>
            <h1>ประวัติ</h1>
          </div>
        </div>
        <button class="theme-toggle" aria-label="สลับโหมด">☀️</button>
      </header>

      <main class="page-content">
        <section class="glass-panel section-panel">
          <div class="panel-head">
            <h3>การเคลื่อนไหวของเงิน</h3>
            <button class="chip-button">เดือนนี้</button>
          </div>
          <div class="transaction-summary">
            <div>
              <span>รายรับ</span>
              <strong id="incomeSummary">฿0</strong>
            </div>
            <div>
              <span>รายจ่าย</span>
              <strong id="expenseSummary">฿0</strong>
            </div>
          </div>
        </section>

        <section class="glass-panel section-panel">
          <div class="panel-head">
            <h3>รายการทั้งหมด</h3>
            <div class="panel-actions">
              <button id="toggleMultiSelectBtn" class="chip-button" type="button">เลือกหลายรายการ</button>
              <button id="openDatePickerBtn" class="chip-button" type="button">เลือกวันที่</button>
            </div>
          </div>

          <div class="tab-group" role="tablist" aria-label="กรองรายการ">
            <button class="tab active" data-filter="all">ทั้งหมด</button>
            <button class="tab" data-filter="income">รายรับ</button>
            <button class="tab" data-filter="expense">รายจ่าย</button>
          </div>

          <input id="transactionSearch" class="search-input" type="search" placeholder="ค้นหารายการ..." />
          <div id="selectedDateChips" class="date-chip-list"></div>
          <div id="transactionTable" class="transaction-table"></div>
          <div id="batchActionBar" class="batch-action-bar hidden"></div>
        </section>
      </main>

      <button id="quickAddTransactionBtn" class="fab" aria-label="เพิ่มรายการ">+</button>

      <nav class="bottom-nav glass-panel" aria-label="เมนูหลัก">
        <a class="nav-item" href="index.html">ภาพรวม</a>
        <a class="nav-item active" href="transactions.html">รายการ</a>
        <a class="nav-item" href="categories.html">หมวดหมู่</a>
        <a class="nav-item" href="analyze.html">วิเคราะห์</a>
        <a class="nav-item" href="settings.html">ตั้งค่า</a>
      </nav>
    </div>

    <script src="js/mock-data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
