<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOD tang | รายการ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=20260919k" />
  </head>
  <body data-page="transactions">
    <div class="app-shell">
      <header class="topbar">
        <div class="profile-meta">
          <div class="avatar">PS</div>
          <div>
            <p class="eyebrow">รายการ</p>
            <h1>ประวัติ</h1>
          </div>
        </div>
      </header>

      <main class="page-content">
        <section class="hero-dark an-summary">
          <div class="hero-top">
            <p class="mini-label">การเคลื่อนไหวของเงิน</p>
            <button id="summaryPeriodBtn" class="chip-button" type="button">เดือนนี้</button>
          </div>
          <div class="transaction-summary">
            <div>
              <span class="summary-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></svg>รายรับ</span>
              <strong id="incomeSummary">฿0</strong>
            </div>
            <div>
              <span class="summary-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>รายจ่าย</span>
              <strong id="expenseSummary">฿0</strong>
            </div>
          </div>
        </section>

        <section class="section-panel">
          <div class="panel-head">
            <h3>รายการทั้งหมด</h3>
            <button id="toggleMultiSelectBtn" class="chip-button" type="button">เลือกหลายรายการ</button>
          </div>
          <button id="openDatePickerBtn" class="chip-button range-chip" type="button">เลือกวันที่</button>

          <div class="tab-group" role="tablist" aria-label="กรองรายการ">
            <button class="tab active" data-filter="all">ทั้งหมด</button>
            <button class="tab" data-filter="income">รายรับ</button>
            <button class="tab" data-filter="expense">รายจ่าย</button>
          </div>

          <div id="categoryFilterChips" class="tab-group" role="tablist" aria-label="กรองตามหมวดหมู่"></div>

          <div id="activeFilterChip" class="date-chip-list"></div>
          <input id="transactionSearch" class="search-input" type="search" placeholder="ค้นหารายการ..." />
          <div id="selectedDateChips" class="date-chip-list"></div>
          <div id="transactionTable" class="transaction-table"></div>
          <div id="batchActionBar" class="batch-action-bar hidden"></div>
        </section>
      </main>

      <button id="quickAddTransactionBtn" class="fab" aria-label="เพิ่มรายการ">+</button>

      <nav class="bottom-nav" aria-label="เมนูหลัก">
        <a class="nav-item" href="index.html" aria-label="ภาพรวม">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="nav-label">ภาพรวม</span>
        </a>
        <a class="nav-item active" href="transactions.html" aria-label="รายการ">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V7"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/></svg>
          <span class="nav-label">รายการ</span>
        </a>
        <a class="nav-item" href="categories.html" aria-label="หมวดหมู่">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span class="nav-label">หมวดหมู่</span>
        </a>
        <a class="nav-item" href="analyze.html" aria-label="วิเคราะห์">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          <span class="nav-label">วิเคราะห์</span>
        </a>
        <a class="nav-item" href="settings.html" aria-label="ตั้งค่า">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="nav-label">ตั้งค่า</span>
        </a>
      </nav>
    </div>

    <script src="js/mock-data.js?v=20260919k"></script>
    <script src="js/app.js?v=20260919k"></script>
  </body>
</html>
